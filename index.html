<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixiJS Particle Playground</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0b0e17;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #dfe6f3;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 12px;
        line-height: 1.7;
        background: rgba(11, 14, 23, 0.65);
        border: 1px solid rgba(223, 230, 243, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        pointer-events: none;
        user-select: none;
        white-space: pre;
      }
      #hud .active {
        color: #6ee7ff;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
